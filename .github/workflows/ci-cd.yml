name: Enterprise PM CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. Backend Spring Boot CI Pipeline
  backend-ci:
    name: Build & Test Backend (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile & Run Backend Unit Tests
        run: |
          cd backend
          mvn clean compile -DskipTests
          mvn test

  # 2. Frontend React TypeScript CI Pipeline
  frontend-ci:
    name: Build & Lint Frontend (React 18 / Node.js 18)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies & Build Bundle
        run: |
          cd frontend
          npm ci
          npm run build

  # 3. Docker Image Verification & Dry-Run Build
  docker-ci:
    name: Verify Docker Container Build Strategy
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false

  # 4. Kubernetes Manifest Validation
  k8s-validate:
    name: Validate Kubernetes Manifests
    needs: [docker-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3

      - name: Dry-Run Validate Manifests
        run: |
          kubectl apply --dry-run=client -f k8s/
