spring:
  application:
    name: enterprise-pm-backend
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  servlet:
    context-path: /api/v1

app:
  storage:
    upload-dir: ${FILE_UPLOAD_DIR:C:/enterprise-pm/attachments}
  security:
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
