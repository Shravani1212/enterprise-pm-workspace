apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pm-backend-hpa
  namespace: enterprise-pm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pm-backend-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
