apiVersion: apps/v1
kind: Deployment
metadata:
  name: pm-frontend-deployment
  namespace: enterprise-pm
  labels:
    app: pm-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pm-frontend
  template:
    metadata:
      labels:
        app: pm-frontend
    spec:
      containers:
        - name: frontend
          image: enterprise-pm/frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: enterprise-pm
spec:
  type: LoadBalancer
  selector:
    app: pm-frontend
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
