services:
  # 1. PostgreSQL Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: pm-postgres
    environment:
      POSTGRES_DB: enterprise_pm_db
      POSTGRES_USER: pm_user
      POSTGRES_PASSWORD: pm_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pm_user -d enterprise_pm_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pm-network

  # 2. Redis In-Memory Cache
  redis:
    image: redis:7-alpine
    container_name: pm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pm-network

  # 3. Apache Kafka Broker
  kafka:
    image: apache/kafka:3.8.0
    container_name: pm-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    networks:
      - pm-network

  # 4. Spring Boot Backend Microservice
  backend:
    build:
      context: ./mini-jira-backend
      dockerfile: Dockerfile
    container_name: pm-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/enterprise_pm_db
      SPRING_DATASOURCE_USERNAME: pm_user
      SPRING_DATASOURCE_PASSWORD: pm_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: enterprise_pm_super_secret_jwt_key_that_is_at_least_32_bytes_long_12345
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pm-network

  # 5. React Frontend Nginx Web Server
  frontend:
    build:
      context: ./mini-jira-frontend
      dockerfile: Dockerfile
    container_name: pm-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - pm-network

volumes:
  postgres_data:
  redis_data:

networks:
  pm-network:
    driver: bridge
